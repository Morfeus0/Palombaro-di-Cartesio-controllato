<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- quota, pressione e servo della prova, a 30 campioni al secondo (generato da prepara.py) -->
    <script src="assets/dati.js"></script>
    <style>
      :root {
        --ground: #efefec;
        --ink: #161616;
        --muted: #6b6b6b;
        --accent: #d0282e;
        --font-display: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #fondo {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="64"
      data-width="1920"
      data-height="1080"
    >
      <div id="fondo"></div>
      <div
        id="apertura"
        data-composition-id="apertura"
        data-composition-src="compositions/apertura.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="prova"
        data-composition-id="prova"
        data-composition-src="compositions/prova.html"
        data-start="4.5"
        data-duration="53"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="chiusura"
        data-composition-id="chiusura"
        data-composition-src="compositions/chiusura.html"
        data-start="57.5"
        data-duration="6.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

      <text x="0" y="128">99</text>
      <text x="1050" y="30">pressione, kPa</text>
      <path id="pr-pressione-voluta" d="" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="8 8"></path>

    </svg>

    <div id="pr-contatore" class="clip" data-start="34" data-duration="19" data-track-index="4">
      <span id="pr-contatore-testo">entro ±1 cm da 0 s</span>
    </div>

  <script>
    const D = window.DATI_M4;
    const C = D.campioni;
    const FPS = D.fps;
    // tempo locale della scena -> secondi dopo le 20:10:55
    const TEMPI = [
      { ini: 0, dur: 16, reale: 5, vel: 1 },
      { ini: 16, dur: 18, reale: 42, vel: 1 },
      { ini: 34, dur: 19, reale: 60, vel: 4 },
    ];
    // da quanti campioni la quota è entro ±1 cm dalla voluta, di fila
    const dentroDa = new Array(C.length).fill(-1);
    for (let i = 0; i < C.length; i++) {
      const [q, r] = C[i];
      const dentro = q !== null && r !== null && Math.abs(q - r) <= 1.0;
      dentroDa[i] = dentro ? (i > 0 && dentroDa[i - 1] >= 0 ? dentroDa[i - 1] : i) : -1;
    }
    const virgola = (v, cifre) => v.toFixed(cifre).replace(".", ",");
    const W = 1285, X0 = 80;
    // dentro il riquadro del grafico: la pressione voluta all'ingresso in HOLD scende per un attimo a 97,7 kPa
    const dentro = (y, alto, basso) => Math.min(basso, Math.max(alto, y));
    const yQuota = (cm) => dentro(290 - (cm / 16) * 280, 6, 290);          // 0-16 cm
    const yPress = (kpa) => dentro(120 - ((kpa - 98.9) / 3.2) * 110, 4, 126); // 98,9-102,1 kPa

    function percorso(i0, i1, passo, x, y, valore) {
      let d = "", su = false;
      for (let i = i0; i <= i1; i += passo) {
        const v = valore(C[i]);
        if (v === null) { su = false; continue; }
        d += (su ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1);
        su = true;
      }
      return d;
    }

    function disegna(L) {
      const s = L < 16 ? TEMPI[0] : L < 34 ? TEMPI[1] : TEMPI[2];
      const reale = s.reale + s.vel * (L - s.ini);
      const i0 = Math.round(s.reale * FPS);
      const iFine = Math.min(C.length - 1, Math.round((s.reale + s.vel * s.dur) * FPS));
      const i1 = Math.min(iFine, Math.round(reale * FPS));
      const x = (i) => X0 + ((i - i0) / (iFine - i0)) * (W - X0);
      const passo = s.vel;
      // prima il riferimento (la fascia ±1 cm e la quota voluta per tutto il tempo), poi i dati fino a ora
      let alto = "", basso = "";
      for (let i = i0; i <= iFine; i += passo) {
        const r = C[i][1];
        if (r === null) continue;
        alto += (alto ? "L" : "M") + x(i).toFixed(1) + " " + yQuota(r + 1).toFixed(1);
        basso = "L" + x(i).toFixed(1) + " " + yQuota(r - 1).toFixed(1) + basso;
      }
      document.getElementById("pr-fascia").setAttribute("d", alto ? alto + basso + "Z" : "");
      document.getElementById("pr-voluta-linea").setAttribute("d", percorso(i0, iFine, passo, x, yQuota, (c) => c[1]));
      document.getElementById("pr-quota-linea").setAttribute("d", percorso(i0, i1, passo, x, yQuota, (c) => c[0]));
      document.getElementById("pr-pressione-voluta").setAttribute("d", percorso(i0, i1, passo, x, yPress, (c) => c[3]));
      document.getElementById("pr-pressione-linea").setAttribute("d", percorso(i0, i1, passo, x, yPress, (c) => c[2]));
      const c = C[i1];
      document.getElementById("pr-quota-val").textContent = c[0] === null ? "–" : virgola(c[0], 1);
      document.getElementById("pr-voluta").textContent = c[1] === null ? "–" : virgola(c[1], 1) + " cm";
      document.getElementById("pr-pressione").textContent = virgola(c[2], 2) + " kPa";
      document.getElementById("pr-servo").textContent = Math.round(c[4]) + "°";
      const tot = 20 * 3600 + 10 * 60 + 55 + Math.floor(reale);
      const hh = Math.floor(tot / 3600), mm = Math.floor((tot % 3600) / 60), ss = tot % 60;
      document.getElementById("pr-ora").textContent =
        String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
      const da = dentroDa[i1];
      document.getElementById("pr-contatore-testo").textContent =
        da < 0 ? "fuori dalla fascia ±1 cm" : "entro ±1 cm da " + Math.floor((i1 - da) / FPS) + " s";
    }

    const tl = gsap.timeline({ paused: true });
    const orologio = { L: 0 };
    tl.to(orologio, { L: 53, duration: 53, ease: "none", onUpdate: () => disegna(orologio.L) }, 0);
    [1, 2, 3].forEach((n, k) => {
      const t = TEMPI[k].ini;
      tl.fromTo("#pr-titolo-" + n + "-b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t + 0.05);
      tl.fromTo("#pr-titolo-" + n + "-i", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t + 0.22);
    });
    tl.fromTo("#pr-contatore-testo", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 34.3);
    disegna(0);
    window.__timelines["prova"] = tl;
  </script>

; Ogni ambiente compila un solo programma di src/: si sceglie con  pio run -e <nome>

; Prova del BMP280 sul tappo (1.3)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8

; Banco elettronico minimo (1.5): BMP280 a 50 Hz e servo comandato dalla seriale
[env:banco]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<prova_banco.cpp>
lib_deps =
    adafruit/Adafruit BMP280 Library@^2.6.8
    madhephaestus/ESP32Servo@^3.0.5
